<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Carrot Dash</title>
<style>
html,body{margin:0;height:100%;background:#0d0d18;overflow:hidden;font-family:system-ui,Segoe UI,Arial,sans-serif;color:#fff;touch-action:none;user-select:none;-webkit-user-select:none}
body{display:flex;align-items:center;justify-content:center}
#stage{position:relative}
canvas{display:block;width:100%;height:100%;background:#000}
#ui{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(8,8,20,.72)}
#ui.hide{display:none}
.card{text-align:center;max-width:86%;padding:14px 22px}
h1{margin:0 0 4px;font-size:clamp(26px,6vw,46px)}
.sub{opacity:.8;margin-bottom:10px;font-size:clamp(12px,2.4vw,16px)}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:10px 22px;margin:5px;background:#ff8c1a;color:#fff;cursor:pointer;font-size:clamp(14px,3vw,19px)}
button.alt{background:#3a3a58}button:disabled{opacity:.4}
input{font:inherit;padding:8px;border-radius:8px;border:0;width:110px;text-align:center}
.small{font-size:clamp(10px,2vw,13px);opacity:.75;margin-top:8px;line-height:1.4}
.msg{color:#ffd166;min-height:1.2em;margin:6px 0}
#touch{position:absolute;inset:0;pointer-events:none;display:none}
#joy{position:absolute;left:3%;bottom:6%;width:22%;aspect-ratio:1;max-width:150px;border-radius:50%;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.35);pointer-events:auto;touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:40%;height:40%;margin:-20% 0 0 -20%;border-radius:50%;background:rgba(255,255,255,.55)}
.tb{position:absolute;pointer-events:auto;touch-action:none;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;background:rgba(255,140,26,.55);border:2px solid rgba(255,255,255,.5);padding:0;margin:0}
#bj{right:3%;bottom:6%;width:17%;aspect-ratio:1;max-width:120px}
#bd{right:21%;bottom:6%;width:12%;aspect-ratio:1;max-width:84px;background:rgba(60,160,255,.55);font-size:12px}
#pz{position:absolute;right:56px;top:8px;padding:4px 10px;font-size:16px;background:rgba(0,0,0,.4)}
#snd{position:absolute;right:8px;top:8px;padding:4px 10px;font-size:16px;background:rgba(0,0,0,.4)}
</style></head><body>
<div id="stage"><canvas id="c" width="960" height="540"></canvas>
<div id="touch"><div id="joy"><div id="knob"></div></div><button class="tb" id="bd">DASH</button><button class="tb" id="bj">JUMP</button></div>
<button id="pz" class="alt">⏸</button><button id="snd" class="alt">🔊</button>
<div id="ui"></div></div>
<script>
(()=>{'use strict';
/* ================= CONFIG (edit here) ================= */
const CFG=Object.freeze({
  entry:10,            // carrot points to enter a run
  refundLevel:7,       // clearing this level returns the entry fee (levels 1-7 = break-even at best)
  dailyProfitCap:60,   // max profit (above entry refunds) a player can earn per day -> keeps farming impossible
  reviveFrom:15, revive:40, // paid extra life, once per run, from this level on
  bossEvery:15,
  startDemoBalance:30, // standalone/demo wallet only
  devHash:4256971335337117, // hash of the test code (code itself is NOT stored in plain text)
  salt:'cd#9x'
});
/* ================= helpers ================= */
const W=960,H=540,GY=440,$=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d'),ui=$('ui'),stage=$('stage');
const rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.random()*a.length|0];
const h53=(s,seed=0)=>{let a=0xdeadbeef^seed,b=0x41c6ce57^seed;for(let i=0,c;i<s.length;i++){c=s.charCodeAt(i);a=Math.imul(a^c,2654435761);b=Math.imul(b^c,1597334677);}a=Math.imul(a^(a>>>16),2246822507);a^=Math.imul(b^(b>>>13),3266489909);b=Math.imul(b^(b>>>16),2246822507);b^=Math.imul(a^(a>>>13),3266489909);return 4294967296*(2097151&b)+(a>>>0);};
const today=()=>new Date().toISOString().slice(0,10);

/* ================= wallet adapters =================
   Standalone: signed localStorage demo wallet.
   Embedded (iframe, add ?embed=1): talks to the host page via postMessage.
   IMPORTANT: for real value (crypto) the HOST/SERVER must own the balance and validate runs. */
const EMB=window.parent!==window&&/[?&]embed=1/.test(location.search);
let wallet;
if(EMB){
  const pend={};let rid=0;
  addEventListener('message',e=>{const d=e.data;if(d&&d.src==='host'&&pend[d.id]){pend[d.id](d);delete pend[d.id];}});
  const call=(type,p)=>new Promise(r=>{const id=++rid;pend[id]=r;parent.postMessage(Object.assign({src:'rabbit-game',type,id},p),'*');setTimeout(()=>{if(pend[id]){delete pend[id];r({ok:false});}},6000);});
  wallet={balance:async()=>(await call('balance',{})).balance|0,
          spend:async(n,run)=>!!(await call('spend',{amount:n,runId:run})).ok,
          award:async(n,run,info)=>(await call('award',{amount:n,runId:run,info})).ok?n:0,
          earnedToday:async()=>(await call('earnedToday',{})).earned|0,
          capLeft:true};
}else{
  const sig=d=>h53([d.b,d.day,d.earn,d.best].join('|')+CFG.salt);
  const load=()=>{try{const d=JSON.parse(localStorage.getItem('cd_w'));if(!d)return{b:CFG.startDemoBalance,day:today(),earn:0,best:0};
    if(d.s!==sig(d))return{b:0,day:today(),earn:0,best:0};if(d.day!==today()){d.day=today();d.earn=0;}return d;}catch(e){return{b:0,day:today(),earn:0,best:0};}};
  const save=d=>{d.s=sig(d);localStorage.setItem('cd_w',JSON.stringify(d));};
  wallet={balance:async()=>load().b,
    spend:async n=>{const d=load();if(d.b<n)return false;d.b-=n;save(d);return true;},
    award:async(n,run,info)=>{const d=load();d.b+=n;if(info&&info.profit)d.earn+=n;save(d);return n;},
    earnedToday:async()=>load().earn};
}

/* ================= worlds (add more freely) ================= */
const WORLDS=[
 ['Sunny Meadow','#6ec6ff','#e3f7ff','#62c46a','#4aa157','#5a3a22'],
 ['Autumn Woods','#f4a259','#ffe6b8','#c8692b','#9a4a1d','#47281a'],
 ['Frozen Peaks','#86c0f5','#eef7ff','#cfe3f4','#a2c4e2','#7f9fbd'],
 ['Scorched Dunes','#ffb347','#ffe9a8','#e6b05a','#c98a3c','#8a5a28'],
 ['Candy Land','#ff9ed8','#ffe6f4','#ff7fbf','#d95fa0','#7a3a6a'],
 ['Haunted Swamp','#3b4a3a','#7d9a74','#2f4a33','#223a28','#1a2a1e'],
 ['Neon City','#12062e','#5a1c8f','#2b0d63','#1a0847','#0a0420'],
 ['Volcano Rim','#3a0d0d','#ff6a2a','#5a1a14','#3a0f0c','#2a0d0a'],
 ['Deep Ocean','#06336b','#2a8bc9','#0f5a99','#0a4577','#0a2a4a'],
 ['Cloud Kingdom','#9ad0ff','#ffffff','#f4f9ff','#dce9f7','#b6c8dc'],
 ['Crystal Caves','#1d1440','#5b3ea8','#3d2a82','#2b1d66','#1a1240'],
 ['Space Station','#02030f','#1b2455','#2a3366','#1e2650','#12183a'],
 ['Toxic Factory','#3d4a1a','#b6d43a','#5a6a22','#44521a','#2c350f'],
 ['Dino Jungle','#2a8a4a','#b8f0a0','#1f7a3a','#16602c','#2a3a14'],
 ['Rainbow Void','#14002b','#ff4fa8','#6a2bd6','#2bb3d6','#10001f'],
 ['Mushroom Grove','#7a4fd6','#f7c6ff','#ff6b9c','#c24b8a','#3a2150'],
 ['Steampunk Skies','#d9a066','#fff0cf','#a8744a','#7a5232','#3a2a1c'],
 ['Pyramid Tomb','#f2c066','#fff1c9','#d9a64e','#b5833a','#6b4a22'],
 ['Lava Temple','#1a0a0a','#a8341a','#4a1a12','#2e100c','#1a0806'],
 ['Aurora Tundra','#071a3a','#2fe3a7','#1c4a7a','#143a63','#0c2440']];
const DARK=new Set(WORLDS.map((x,i)=>i).filter(i=>{const c=WORLDS[i][1];return parseInt(c.slice(1,3),16)+parseInt(c.slice(3,5),16)+parseInt(c.slice(5,7),16)<300;}));
const HINT={5:'New: bouncing Slimes - stomp them!',6:'A HOUND CHASES YOU! Rocks, foxes, crows, bats = stumble. Two stumbles = caught!',7:'New: Snakes slither low and fast',9:'New: Ghosts drift in waves',11:'LASERS! Jump the low beam, duck the high beam'};

/* ================= audio (all synthesized, no files) ================= */
let ac,mg,musicOn=true,sfxOn=true,nextT=0,stp=0;
const audio=()=>{if(!ac){const A=window.AudioContext||window.webkitAudioContext;if(!A)return;ac=new A();mg=ac.createGain();mg.gain.value=.55;mg.connect(ac.destination);}if(ac.state==='suspended')ac.resume();};
function tone(f,t,d,type,v,to){if(!ac)return;const o=ac.createOscillator(),g=ac.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);g.gain.setValueAtTime(v||.07,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(mg);o.start(t);o.stop(t+d+.03);}
function sfx(k){if(!ac||!sfxOn)return;const t=ac.currentTime;
 if(k==='jump')tone(300,t,.14,'square',.06,650);else if(k==='jump2')tone(450,t,.14,'square',.06,900);
 else if(k==='stomp'){tone(200,t,.12,'triangle',.12,60);tone(500,t+.03,.1,'square',.05,900);}
 else if(k==='carrot')tone(880,t,.07,'sine',.09,1320);
 else if(k==='dash'){tone(180,t,.4,'sawtooth',.08,700);}
 else if(k==='item')[0,4,7,12].forEach((n,i)=>tone(523*2**(n/12),t+i*.06,.1,'triangle',.08));
 else if(k==='hit')tone(300,t,.2,'sawtooth',.1,80);
 else if(k==='die'){tone(400,t,.7,'sawtooth',.12,40);tone(200,t+.1,.7,'square',.06,30);}
 else if(k==='growl'){tone(90,t,.5,'sawtooth',.1,50);tone(70,t+.1,.4,'square',.05,40);}
 else if(k==='win')[0,4,7,12,16].forEach((n,i)=>tone(392*2**(n/12),t+i*.09,.18,'square',.07));}
const SC=[[0,2,4,7,9],[0,3,5,7,10],[0,2,3,7,8],[0,2,5,7,9],[0,1,5,7,8]];
function music(){if(!ac||!musicOn||G.state!=='play')return;const L=G.level,w=(L-1)%WORLDS.length,sc=SC[w%5],bpm=Math.min(112+L*3,176),sd=30/bpm,root=55*2**((w*2%12)/12);
 if(nextT<ac.currentTime-.5)nextT=ac.currentTime;
 while(nextT<ac.currentTime+.25){const s=stp%16,bar=(stp>>4)%4,deg=[0,0,3,4][bar];
  if(s%4===0)tone(root*2**(sc[deg%5]/12),nextT,sd*3,'triangle',.16);
  if(s%2===0||s%8===7){const r=((s*7+w*5+bar*3)%11);if(r<8)tone(root*4*2**(sc[(r+deg)%5]/12+((r>5)?1:0)),nextT,sd*1.6,'square',.04);}
  if(s%4===2)tone(4000,nextT,.03,'square',.015);
  nextT+=sd;stp++;}}

/* ================= state ================= */
const P={x:200,y:GY,vy:0,onG:true,coy:0,buf:0,jumps:0,duck:false,shield:false,dash:0,inv:0};
const G={state:'menu',level:1,score:0,dist:0,goal:0,nextAt:0,t:0,objs:[],lasers:[],ban:0,gap:250,chase:false,gw:0,bn:0,lt:4,parts:[],meter:0,combo:1,slow:0,
 test:false,run:'',revived:false,boss:false,bt:0,earned:0,msg:'',gt:0,rt0:0,inputs:0,shake:0};
const keys={},joy={x:0,y:0};let joyUp=false;

/* ================= input ================= */
const jumpPress=()=>{P.buf=.13;G.inputs++;};
const dashPress=()=>{if(G.state==='play'&&G.meter>=10&&P.dash<=0){P.dash=1.2;G.meter=0;P.inv=Math.max(P.inv,1.3);sfx('dash');G.inputs++;}};
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();
 if(e.repeat)return;if(k==='p'||k==='escape'){if(G.state==='play')pause();else if(G.state==='pause')unpause();}keys[k]=1;if(k===' '||k==='arrowup'||k==='w')jumpPress();if(k==='shift'||k==='e'||k==='x')dashPress();audio();});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=0;});
const jb=$('joy'),jk=$('knob');let jid=null;
function jmove(e){const r=jb.getBoundingClientRect();let dx=(e.clientX-r.left-r.width/2)/(r.width/2),dy=(e.clientY-r.top-r.height/2)/(r.height/2);const m=Math.hypot(dx,dy);if(m>1){dx/=m;dy/=m;}joy.x=dx;joy.y=dy;jk.style.transform=`translate(${dx*70}%,${dy*70}%)`;
 if(dy<-.6&&!joyUp){joyUp=true;jumpPress();}if(dy>-.3)joyUp=false;}
jb.addEventListener('pointerdown',e=>{audio();jid=e.pointerId;jb.setPointerCapture(jid);jmove(e);});
jb.addEventListener('pointermove',e=>{if(e.pointerId===jid)jmove(e);});
const jend=e=>{if(e.pointerId===jid){jid=null;joy.x=joy.y=0;joyUp=false;jk.style.transform='';}};
jb.addEventListener('pointerup',jend);jb.addEventListener('pointercancel',jend);
$('bj').addEventListener('pointerdown',e=>{e.preventDefault();audio();jumpPress();});
$('bd').addEventListener('pointerdown',e=>{e.preventDefault();dashPress();});
if('ontouchstart' in window||matchMedia('(pointer:coarse)').matches)$('touch').style.display='block';
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G.state==='play')pause();});
addEventListener('blur',()=>{if(G.state==='play')pause();});
$('pz').onclick=()=>{if(G.state==='play')pause();};
$('snd').onclick=()=>{audio();musicOn=sfxOn=!musicOn;$('snd').textContent=musicOn?'🔊':'🔇';};
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);stage.style.width=W*s+'px';stage.style.height=H*s+'px';}
addEventListener('resize',fit);fit();

/* ================= UI screens ================= */
const show=h=>{ui.innerHTML='<div class="card">'+h+'</div>';ui.classList.remove('hide');};
const hide=()=>ui.classList.add('hide');
const bal=async()=>await wallet.balance();
async function menu(msg){G.state='menu';const b=await bal();
 show(`<h1>🐰 Carrot Dash</h1><div class="sub">Jump. Stomp. Dash. The run never ends.</div>
 <div style="font-size:20px">Your carrots: <b>${b}</b> 🥕</div>
 <button data-a="play">PLAY — ${G.test?'FREE (TEST)':CFG.entry+' 🥕'}</button>
 <div class="msg">${msg||''}</div>
 <div><input id="code" placeholder="test code" autocomplete="off"><button class="alt" data-a="code">Apply</button></div>
 <div class="small">Clearing level ${CFG.refundLevel} refunds your entry fee. Real profit only starts after that and is small (daily cap ${CFG.dailyProfitCap}).<br>
 Keys: ←/→ move · Space/↑ jump (double jump) · ↓ duck / fast-fall · Shift dash (collect 10 golden carrots) · P / Esc / ⏸ pause<br>Phone: joystick (move, up = jump, down = duck) + JUMP / DASH buttons<br>Land on foxes, crows and bats to stomp them. Spikes, rocks and saws can't be stomped. From level 6 a hound hunts you: bumping into rocks/foxes/crows/bats makes you stumble, two stumbles in a row and you're caught. Spikes, saws, fire and lasers still kill instantly.</div>`);}
ui.addEventListener('click',async e=>{const a=e.target.dataset&&e.target.dataset.a;if(!a)return;audio();
 if(a==='play')startRun();
 else if(a==='code'){const v=($('code').value||'').trim().toLowerCase();if(h53('rb:'+v)===CFG.devHash){G.test=true;menu('TEST MODE on: free entry, nothing is credited to your wallet.');}else menu('Invalid code.');}
 else if(a==='next'){G.level++;startLevel();}
 else if(a==='resume')unpause();
 else if(a==='cashout')menu('Cashed out at level '+G.level+'. Paid out this run: '+G.earned+' 🥕');
 else if(a==='menu')menu();
 else if(a==='revive')doRevive();});
function pause(){G.state='pause';show(`<h1>Paused</h1><div class="sub">Level ${G.level} · Paid out this run: ${G.earned} 🥕<br>Everything you earned so far is already in your wallet.</div><button data-a="resume">▶ Continue</button><button class="alt" data-a="cashout">Cash out &amp; quit</button>`);}
function unpause(){G.state='play';hide();P.inv=Math.max(P.inv,1.2);}

/* ================= run / level flow ================= */
async function startRun(){
 if(!G.test){const b=await bal();if(b<CFG.entry)return menu('Not enough carrots! Earn more in the main game, then come back.');
  if(!await wallet.spend(CFG.entry,G.run=Math.random().toString(36).slice(2)+Date.now().toString(36)))return menu('Payment failed.');}
 else G.run='test';
 Object.assign(G,{level:1,score:0,revived:false,earned:0,inputs:0});startLevel();}
function startLevel(){const L=G.level;
 G.objs=[];G.parts=[];G.dist=0;G.boss=L%CFG.bossEvery===0;G.goal=(5200+L*260)*(G.boss?1.5:1);G.nextAt=650;G.t=0;G.gt=0;G.rt0=performance.now();G.slow=0;G.bt=1.5;G.combo=1;G.lasers=[];G.lt=rnd(3,6);G.chase=L>=6;G.gap=250;G.ban=2.8;G.bn=0;G.gw=0;
 Object.assign(P,{x:200,y:GY,vy:0,onG:true,coy:0,buf:0,jumps:0,duck:false,dash:0,inv:1.2});G.state='play';hide();stp=0;audio();if(ac)nextT=ac.currentTime+.1;}
async function clearLevel(){G.state='clear';sfx('win');const L=G.level;
 const real=(performance.now()-G.rt0)/1000,fake=G.gt>real*1.25+1||real<G.goal/980;  // speed-hack / time-warp check
 let txt='',profit=0,refund=0;
 if(fake)txt='Run time looked invalid — no carrots paid for this level.';
 else if(!G.test){
  if(L===CFG.refundLevel)refund=CFG.entry;
  if(L>CFG.refundLevel){let r=1+((L-CFG.refundLevel-1)/3|0);if(G.boss)r+=8;
   const left=Math.max(0,CFG.dailyProfitCap-await wallet.earnedToday());profit=Math.min(r,left);if(profit<r)txt='Daily profit cap reached.';}
  const pay=refund+profit;if(pay>0){await wallet.award(pay,G.run,{profit:profit,level:L,inputs:G.inputs,ms:Math.round(real*1000)});G.earned+=pay;}
 }
 const best=Math.max(L,+localStorage.getItem('cd_best')||0);localStorage.setItem('cd_best',best);
 G.toast={a:'Level '+L+' cleared!'+(G.boss?'  Boss defeated!':''),b:G.test?'TEST: nothing credited':((refund?'Entry fee refunded +'+refund+' carrots':'')+(profit?(refund?'   ':'')+'Profit +'+profit+' carrots':'')),c:txt||((L<=CFG.refundLevel&&!refund&&!G.test)?'Payouts start at level '+CFG.refundLevel:'')};
 setTimeout(()=>{if(G.state==='clear'){G.level++;startLevel();}},2200);}
async function die(){if(G.state!=='play')return;G.state='dead';sfx('die');G.shake=.4;boom(P.x,P.y-25,30,'#fff');
 const can=G.level>=CFG.reviveFrom&&!G.revived;
 setTimeout(()=>{if(G.state!=='dead')return;const best=Math.max(G.level,+localStorage.getItem('cd_best')||0);localStorage.setItem('cd_best',best);
  show(`<h1>💥 Game over</h1><div class="sub">Level ${G.level} · Score ${G.score|0} · Paid out this run: ${G.earned} 🥕</div>
  ${can?`<button data-a="revive">Revive once — ${CFG.revive} 🥕</button>`:''}<button class="alt" data-a="menu">Menu</button>`);},650);}
async function doRevive(){if(!G.test&&!await wallet.spend(CFG.revive,G.run+'r'))return menu('Not enough carrots to revive.');
 G.revived=true;G.objs=G.objs.filter(o=>o.x>P.x+260||o.x<-100);Object.assign(P,{y:GY,vy:0,onG:true,inv:2.5,dash:0});G.state='play';hide();}

/* ================= spawning ================= */
const DEF={rock:{w:40,h:40,y:GY-40},spike:{w:64,h:26,y:GY-26},fox:{w:54,h:38,y:GY-38,m:.38,st:1,e:'🦊'},crow:{w:44,h:28,y:GY-62,m:.12,st:1,e:'🐦'},
 bat:{w:38,h:26,y:GY-120,m:.15,st:1,wave:1,e:'🦇'},saw:{w:44,h:44,y:GY-44,m:.65},fire:{w:30,h:30,y:-60,vy:640},proj:{w:28,h:20,y:GY-40,m:.3},slime:{w:36,h:32,y:GY-32,m:.1,st:1,bounce:1},snake:{w:62,h:18,y:GY-18,m:.25,st:1},ghost:{w:40,h:44,y:GY-110,m:.3,wave:1}};
function add(k,x,y){const d=DEF[k];const o=Object.assign({k,x,y:y!==undefined?y:d.y,m:0},d);if(y!==undefined)o.y=y;o.y0=o.y;o.ph=rnd(0,6);G.objs.push(o);return o;}
function carrots(x){for(let i=0;i<5;i++)G.objs.push({k:'carrot',x:x-70+i*34,y:GY-70-Math.sin(i/4*Math.PI)*95,w:22,h:22,m:0});}
function spawn(sp){const L=G.level,X=W+60;const pool=['rock','spike','fox','crow'];if(L>=3)pool.push('pit');if(L>=4)pool.push('bat');if(L>=6)pool.push('saw');if(L>=5)pool.push('slime');if(L>=7)pool.push('snake');if(L>=8)pool.push('fire');if(L>=9)pool.push('ghost');
 const mk=(k,x)=>{if(k==='pit'){G.objs.push({k:'pit',x,y:GY,w:100+Math.min(70,L*2),h:0,m:0});carrots(x+60);}else{add(k,x);if(k!=='fire'&&k!=='bat'&&k!=='crow'&&k!=='ghost')carrots(x+20);}};
 mk(pick(pool),X);

  ctx.shadowBlur=0;ctx.fillStyle='rgba(0,0,0,.4)';ctx.fillRect(280,16,400,12);ctx.fillStyle='#ff8c1a';ctx.fillRect(280,16,400*Math.min(1,G.dist/G.goal),12);
  ctx.fillStyle='rgba(0,0,0,.4)';ctx.fillRect(280,34,160,10);ctx.fillStyle=G.meter>=10?'#4cf':'#ffd166';ctx.fillRect(280,34,16*G.meter,10);
  ctx.fillStyle='#fff';ctx.font='12px system-ui';ctx.fillText(G.meter>=10?'DASH READY! (Shift)':'dash',446,43);
  if(G.ban>0&&G.state==='play'){ctx.globalAlpha=Math.min(1,G.ban);ctx.textAlign='center';ctx.shadowColor='#000';ctx.shadowBlur=8;ctx.font='bold 40px system-ui';ctx.fillText(G.boss?'⚔ BOSS FIGHT ⚔':'World: '+w[0],W/2,190);const hnt=HINT[L];if(hnt){ctx.font='bold 20px system-ui';ctx.fillStyle='#ffd166';ctx.fillText(hnt,W/2,225);}ctx.globalAlpha=1;ctx.shadowBlur=0;}}
 if(G.state==='clear'&&G.toast){ctx.textAlign='center';ctx.shadowColor='#000';ctx.shadowBlur=8;ctx.fillStyle='#fff';ctx.font='bold 44px system-ui';ctx.fillText(G.toast.a,W/2,200);ctx.font='bold 24px system-ui';ctx.fillStyle='#ffd166';ctx.fillText(G.toast.b,W/2,240);ctx.font='18px system-ui';ctx.fillStyle='#fff';ctx.fillText(G.toast.c,W/2,272);ctx.fillText('Next: '+WORLDS[L%WORLDS.length][0]+((L+1)%CFG.bossEvery===0?'  -  BOSS':''),W/2,310);ctx.shadowBlur=0;}
 ctx.restore();}

/* ================= loop ================= */
let last=0;
function frame(ts){requestAnimationFrame(frame);let dt=Math.min((ts-last)/1000,1/30);last=ts;if(!(dt>0))return;
 if(G.state==='play')update(dt);if(G.state==='dead'){G.t+=dt;G.shake-=dt;}draw();music();}
requestAnimationFrame(frame);
G.t=0;menu();

/* ================= public API (for embedding / future server hookup) ================= */
window.CarrotDash=Object.freeze({version:'0.1',config:CFG,isEmbedded:EMB});
})();
