<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Carrot Dash</title>
<!--
CARROT DASH - single file, no dependencies. Put it on GitHub Pages as index.html.

INTEGRATION (mini-game inside another site/game):
A) iframe: <iframe src="carrot-dash/index.html"></iframe>
   Game -> host:  {type:'carrot-dash:ready'}, {type:'carrot-dash:delta', amount, balance}, {type:'carrot-dash:exit'}, {type:'carrot-dash:out-of-carrots'} (balance < entry fee: send the player out so they earn carrots elsewhere)
   Host -> game:  iframe.contentWindow.postMessage({type:'carrot-dash:balance', balance:N}, '*')
   (the host owns the real carrot balance; delta is negative for entry fee, positive for rewards/refund)
B) same page: window.CarrotDash.setBalance(n); window.CarrotDash.onChange=(delta,balance)=>{...}
Standalone it saves balance/best score in localStorage (starts with 20 carrots).
-->
<style>
html,body{margin:0;height:100%;background:#0b0e14;color:#fff;font-family:system-ui,Arial,sans-serif;overflow:hidden;touch-action:none;user-select:none}
#wrap{height:100%;display:flex;align-items:center;justify-content:center}
#box{position:relative;height:min(100vh,133.33vw);aspect-ratio:3/4}
canvas{width:100%;height:100%;display:block;border-radius:10px}
#ui{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;background:rgba(8,10,16,.86);padding:20px;border-radius:10px}
h1{margin:0;font-size:clamp(26px,7vw,40px);color:#ff9b3d}
.stat{background:#1b2230;border-radius:12px;padding:12px 18px;line-height:1.7}
button{font:700 18px system-ui;padding:14px 26px;border:0;border-radius:12px;background:#ff8a1f;color:#fff;cursor:pointer}
button.alt{background:#34405a}button:disabled{background:#555;cursor:not-allowed}
input{font:16px system-ui;padding:9px;border-radius:8px;border:0;text-align:center}
#mute{position:absolute;left:12px;bottom:12px;width:40px;height:40px;padding:0;font-size:18px;border-radius:50%;background:rgba(52,64,90,.85);z-index:5}
small{opacity:.7;max-width:340px;line-height:1.4}
#dashbtn{display:none;position:absolute;right:14px;bottom:14px;width:74px;height:74px;border-radius:50%;background:rgba(255,138,31,.75);font-size:15px;padding:0}
@media(pointer:coarse){#dashbtn{display:block}}
</style></head><body>
<div id="wrap"><div id="box"><canvas id="c"></canvas><button id="dashbtn">DASH</button><button id="mute">🔊</button><div id="ui"></div></div></div>
<script>
(()=>{
const W=480,H=640,FEE=10,cv=document.getElementById('c'),ctx=cv.getContext('2d'),$=id=>document.getElementById(id);
cv.width=W;cv.height=H;ctx.textAlign='center';ctx.textBaseline='middle';
const embedded=window.parent!==window;
const store={get:(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:+v}catch(e){return d}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
let bal=embedded?0:store.get('cd_bal',20);
const API=window.CarrotDash={onChange:null,getBalance:()=>bal,setBalance(n){bal=+n||0;if(!embedded)store.set('cd_bal',bal);cur&&cur()}};
function change(d){bal+=d;if(!embedded)store.set('cd_bal',bal);
 if(embedded)parent.postMessage({type:'carrot-dash:delta',amount:d,balance:bal},'*');
 if(API.onChange)API.onChange(d,bal)}
addEventListener('message',e=>{const m=e.data;if(m&&m.type==='carrot-dash:balance'){bal=+m.balance||0;cur&&cur()}});
if(embedded)parent.postMessage({type:'carrot-dash:ready'},'*');

const WORLDS=[
 {n:'Sunny Meadow',bg:'#2f6b2f',dot:'#3b8a3b',en:['fox','bounce']},
 {n:'Midnight Forest',bg:'#14223a',dot:'#1d3252',en:['fox','hawk'],dark:1},
 {n:'Haunted Farm',bg:'#6b5a2f',dot:'#80703d',en:['bounce','beam']},
 {n:'Frozen Peaks',bg:'#bcd6e6',dot:'#e3f1fa',en:['wolf','hawk'],ice:1},
 {n:'Spooky Graveyard',bg:'#2a1f3a',dot:'#3b2c52',en:['ghost','bounce']},
 {n:'Volcano Core',bg:'#4a1410',dot:'#7a2a14',en:['meteor','wolf']},
 {n:'Crystal Cave',bg:'#251b3d',dot:'#4a3a85',en:['bat','snake']},
 {n:'Dune Sands',bg:'#c9a35a',dot:'#dbb878',en:['snake','fox','beam']},
 {n:'Toxic Swamp',bg:'#2d4a2a',dot:'#4b7a30',en:['snake','ghost','bounce']},
 {n:'Robot Factory',bg:'#3a3f4a',dot:'#596070',en:['turret','beam','bounce']},
 {n:'Neon City',bg:'#140a2e',dot:'#4a1f8f',en:['bat','turret','hawk']},
 {n:'Storm Sky',bg:'#2b3a55',dot:'#46608a',en:['hawk','meteor','bat']},
 {n:'Candy Land',bg:'#d77ab0',dot:'#f4a9d2',en:['spin','bounce','fox']},
 {n:'Blood Moon',bg:'#2a0a14',dot:'#511426',en:['wolf','ghost','hawk'],dark:1},
 {n:'Void Realm',bg:'#06061a',dot:'#1d1d55',en:['spin','meteor','turret','bat'],dark:1}];
const DEV_CODE='rahal'; // remove or change before the public launch
const REFUND_L1=0; // carrots refunded if you die before clearing level 1 (0 = nothing)
const dots=Array.from({length:70},()=>[Math.random()*W,Math.random()*H,2+Math.random()*3]);
let dev=store.get('cd_dev',0),sl=store.get('cd_sl',1),AC=null,mute=store.get('cd_mute',0);
const keys={};let ptr=null,st='menu',g=null,cur=null,last=0,parts=[],shake=0;
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;ac();keys[e.code]=1;if(e.code==='KeyM')$('mute').click();if(e.code==='Space'){dash();e.preventDefault()}if(e.code.startsWith('Arrow'))e.preventDefault()});addEventListener('pointerdown',()=>ac());
addEventListener('keyup',e=>keys[e.code]=0);
const pp=e=>{const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height-(e.pointerType==='touch'?45:0)}};
cv.addEventListener('pointerdown',e=>{ptr=pp(e)});cv.addEventListener('pointermove',e=>{if(ptr)ptr=pp(e)});
addEventListener('pointerup',()=>ptr=null);
$('dashbtn').addEventListener('pointerdown',e=>{e.stopPropagation();dash()});
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,d,ty='square',v=.05,sl2=0,dl=0){if(mute)return;const a=ac();if(!a)return;const o=a.createOscillator(),gn=a.createGain(),t=a.currentTime+dl;o.type=ty;o.frequency.setValueAtTime(f,t);if(sl2)o.frequency.exponentialRampToValueAtTime(Math.max(20,f*sl2),t+d);gn.gain.setValueAtTime(v,t);gn.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(gn);gn.connect(a.destination);o.start(t);o.stop(t+d)}
const SFX={pick:c=>tone(520+c*90,.12,'square',.05,1.6),dash:()=>tone(300,.18,'sawtooth',.04,3),warn:()=>tone(880,.06,'square',.03),boom:()=>tone(110,.3,'sawtooth',.07,.3),
 clear:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.18,'triangle',.07,0,i*.09)),die:()=>tone(400,.7,'sawtooth',.07,.1),start:()=>[392,523].forEach((f,i)=>tone(f,.15,'square',.05,0,i*.1)),rot:()=>tone(160,.15,'triangle',.04,.6),item:()=>[660,880,1100].forEach((f,i)=>tone(f,.1,'triangle',.06,0,i*.07))};
const sfx=(n,a)=>SFX[n](a);
const mb=$('mute');mb.textContent=mute?'🔇':'🔊';mb.onclick=()=>{mute^=1;store.set('cd_mute',mute);mb.textContent=mute?'🔇':'🔊';mb.blur()};
let ms=0;
function mus(){let dly=260;if(st==='play'&&g&&!g.cl){const sc=[0,3,5,7,10],root=[110,98,123,131,104,87,117,92,98,139,147,124,110,82,73][(g.L-1)%15],n=sc[(ms*3+(ms>>2))%5];if(ms%2===0)tone(root*Math.pow(2,n/12),.14,'triangle',.05);if(ms%4===0)tone(root,.22,'sine',.07);ms++;dly=Math.max(105,200-g.L*4)}setTimeout(mus,dly)}
function broke(){return !dev&&bal<FEE?`<div class=stat style="border:1px solid #e55">Out of carrots!<br>Earn <b>${FEE} 🥕</b> in other ways, then come back.</div><button id=lv class=alt>${embedded?'Leave the game':'OK'}</button>`:''}
function codeUI(){return dev?`<div class=stat style="border:1px solid #ff8a1f">🛠 TEST MODE · free entry, no carrots won<br>Start at level <input id=sl type=number min=1 max=99 value=${sl} style="width:60px"> <button id=off class=alt style="font-size:13px;padding:6px 12px">Exit</button></div>`:`<div><input id=code placeholder="Enter code" autocomplete=off style="width:130px"> <button id=ap class=alt style="font-size:14px;padding:8px 14px">Apply</button></div>`}
function bindCode(){const a=$('ap');if(a)a.onclick=()=>{if($('code').value.trim().toLowerCase()===DEV_CODE){dev=1;store.set('cd_dev',1);cur()}else{$('code').value='';$('code').placeholder='Wrong code'}};
 const o=$('off');if(o)o.onclick=()=>{dev=0;store.set('cd_dev',0);cur()};
 const lv=$('lv');if(lv)lv.onclick=()=>{if(embedded)parent.postMessage({type:'carrot-dash:exit',reason:'no-carrots'},'*');else if(API.onNeedCarrots)API.onNeedCarrots()}}

const show=h=>{$('ui').innerHTML=h;$('ui').style.display='flex'},hide=()=>$('ui').style.display='none';
function menu(){st='menu';cur=menu;
 show(`<h1>🐇 CARROT DASH</h1><p style="margin:0">Endless levels. One life. No mercy.</p>
 <div class=stat>Your carrots: <b>${bal} 🥕</b><br>Entry fee: <b>${FEE} 🥕</b><br>Best level: <b>${store.get('cd_best',0)}</b> · High score: <b>${store.get('cd_hi',0)}</b></div>
 ${broke()}<button id=go ${dev||bal>=FEE?'':'hidden'}>${dev?'START · FREE (test)':bal<FEE?'Need '+FEE+' 🥕':'ENTER · −'+FEE+' 🥕'}</button>
 ${codeUI()}<small>Move: WASD / arrows / drag. DASH: Space or button (short invincible burst).<br>Collect the carrots before they rot to clear a level and win carrot points. Fall on level 1 and you only get ${REFUND_L1} 🥕 back. Out of carrots? Earn more elsewhere, then return.</small>`);
 $('go').onclick=start;bindCode()}
function over(){st='over';cur=over;if(embedded&&!dev&&bal<FEE)parent.postMessage({type:'carrot-dash:out-of-carrots'},'*');
 show(`<h1>💀 CAUGHT!</h1><div class=stat>Level reached: <b>${g.L}</b><br>Score: <b>${g.score}</b>${g.nb?' · NEW BEST!':''}<br>Carrots won: <b>${dev?'— (test)':'+'+g.earned}</b>${g.ref?'<br>Refund: <b>+'+g.ref+' 🥕</b>':''}<br>Balance: <b>${bal} 🥕</b></div>
 ${broke()}<button id=go ${dev||bal>=FEE?'':'hidden'}>${dev?'TRY AGAIN · FREE (test)':bal<FEE?'Need '+FEE+' 🥕':'TRY AGAIN · −'+FEE+' 🥕'}</button>
 <button id=mn class=alt>${embedded?'Back to room':'Menu'}</button>`);
 $('go').onclick=start;bindCode();$('mn').onclick=()=>embedded?parent.postMessage({type:'carrot-dash:exit'},'*'):menu()}

function start(){if(!dev&&bal<FEE)return;const s=$('sl');if(s)sl=Math.max(1,Math.min(99,+s.value||1));store.set('cd_sl',sl);if(!dev)change(-FEE);hide();ac();sfx('start');
 g={L:0,cleared:0,score:0,earned:0,combo:0,lp:-9,t:0,ref:0,nb:0};level(dev?sl:1);st='play'}
function level(L){const w=WORLDS[(L-1)%WORLDS.length],k=Math.max(1,Math.ceil(L/4)-(w.en.length>2?1:0));
 Object.assign(g,{L,w,sp:Math.min(1+.05*(L-1),2.2),target:L%15===0?10+2*(L/15|0):Math.min(4+L,26),boss:L%15===0,itemDone:0,item:null,slow:0,got:0,carrots:[],en:[],grace:1.3,spawn:0,cl:0,
  r:{x:W/2,y:H*.78,vx:0,vy:0,dash:0,cd:0,fx:0,fy:-1,sh:(g.r&&g.r.sh)||0,mag:0,inv:0}});
 const C={bounce:k+1,beam:Math.min(k,3),ghost:Math.min(k,3),meteor:Math.min(k+1,5),bat:Math.min(k,4),snake:Math.min(k,3),boss:1,spin:Math.min(Math.ceil(k/2),3),turret:Math.min(Math.ceil(k/2),3)};
 (g.boss?['boss','spin']:w.en).forEach(t=>{const n=C[t]||Math.min(k,5);for(let i=0;i<n;i++)g.en.push(mk(t))})}
function far(){let x,y;do{x=Math.random()*W;y=44+Math.random()*(H-44)}while(Math.hypot(x-g.r.x,y-g.r.y)<230);return[x,y]}
function mk(t){const[x,y]=far(),sp=g.sp;
 if(t==='fox'||t==='wolf')return{t,x,y,vx:0,vy:0,r:13,s:(t==='wolf'?95:68)*sp,e:t==='wolf'?'🐺':'🦊'};
 if(t==='bounce'){const a=Math.random()*6.28;return{t,x,y,vx:Math.cos(a)*105*sp,vy:Math.sin(a)*105*sp,r:12,e:'🦔'}}
 if(t==='hawk')return{t,x:-99,y:-99,st:0,tm:.5+Math.random()*2,r:12,e:'🦅',dx:0,dy:1,w:0};
 if(t==='boss')return{t,x:W/2,y:120,r:34,e:['🦊','🦅','👹'][((g.L/15|0)-1)%3],bt:2.5,p:0};
 if(t==='turret')return{t,x,y,r:13,e:'🤖',cd:1+Math.random()*2};
 if(t==='spin'){const R=80+Math.random()*50,cx=R+10+Math.random()*(W-2*R-20),cy=R+50+Math.random()*(H-2*R-60),a=Math.random()*6.28;return{t,R,cx,cy,a,x:cx+Math.cos(a)*R,y:cy+Math.sin(a)*R,r:11,e:'⚙️'}}
 if(t==='snake'){const l=Math.random()<.5;return{t,x:l?-20:W+20,y:0,by:70+Math.random()*(H-130),d:l?1:-1,ph:Math.random()*6,r:12,e:'🐍'}}
 if(t==='bat')return{t,x,y,vx:0,vy:0,tx:x,ty:y,tm:0,r:10,e:'🦇'};
 if(t==='ghost')return{t,x,y,r:13,e:'👻',slow:0};
 if(t==='meteor')return{t,x:0,y:0,s:0,f:0,tm:-Math.random()*2,wt:Math.max(.7,1.2-.03*g.L),R:40};
 return{t:'beam',h:Math.random()<.5,p:0,tm:-Math.random()*1.5,s:0,wt:Math.max(.6,1.15-.03*g.L)}}

function shoot(x,y,a,v){g.en.push({t:'bullet',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,r:6})}
function dash(){if(st!=='play'||!g||g.r.cd>0||g.grace>0)return;g.r.dash=.18;g.r.cd=1.5;sfx('dash');burst(g.r.x,g.r.y,'#ffd27a',8)}
function burst(x,y,c,n){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=40+Math.random()*140;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.5,c})}}
function die(){if(st!=='play')return;if(g.r.sh){g.r.sh=0;g.r.inv=1;sfx('boom');burst(g.r.x,g.r.y,'#7df',20);return}st='dying';shake=.45;burst(g.r.x,g.r.y,'#ff5050',28);
 sfx('die');if(!dev&&!g.cleared&&REFUND_L1>0){change(REFUND_L1);g.ref=REFUND_L1}
 if(!dev&&g.score>store.get('cd_hi',0)){g.nb=1;store.set('cd_hi',g.score)}
 if(!dev&&g.L>store.get('cd_best',0))store.set('cd_best',g.L);setTimeout(over,850)}

function update(dt){const r=g.r;g.t+=dt;
 if(g.cl>0){g.cl-=dt;if(g.cl<=0)level(g.L+1);return}
 let ax=(keys.ArrowRight||keys.KeyD?1:0)-(keys.ArrowLeft||keys.KeyA?1:0),ay=(keys.ArrowDown||keys.KeyS?1:0)-(keys.ArrowUp||keys.KeyW?1:0);
 if(!ax&&!ay&&ptr){const dx=ptr.x-r.x,dy=ptr.y-r.y,d=Math.hypot(dx,dy);if(d>6){ax=dx/d;ay=dy/d}}
 else{const m=Math.hypot(ax,ay);if(m){ax/=m;ay/=m}}
 if(ax||ay){r.fx=ax;r.fy=ay}
 if(r.dash>0&&!ax&&!ay){ax=r.fx;ay=r.fy}
 const sp=r.dash>0?640:190,ac=r.dash>0?40:(g.w.ice?3:14);
 r.vx+=(ax*sp-r.vx)*Math.min(1,dt*ac);r.vy+=(ay*sp-r.vy)*Math.min(1,dt*ac);
 r.x=Math.max(12,Math.min(W-12,r.x+r.vx*dt));r.y=Math.max(50,Math.min(H-12,r.y+r.vy*dt));
 r.dash-=dt;r.cd-=dt;
 // carrots
 g.spawn-=dt;
 if(g.spawn<=0&&g.carrots.length<3){let x,y;do{x=30+Math.random()*(W-60);y=70+Math.random()*(H-100)}while(Math.hypot(x-r.x,y-r.y)<100);
  g.carrots.push({x,y,l:Math.max(3.8,7-.12*g.L)});g.spawn=.9}
 for(let i=g.carrots.length-1;i>=0;i--){const c=g.carrots[i];c.l-=dt;
  if(c.l<=0){g.carrots.splice(i,1);g.combo=0;sfx('rot');continue}
  if(Math.hypot(c.x-r.x,c.y-r.y)<21){g.carrots.splice(i,1);g.got++;
   g.combo=g.t-g.lp<3?Math.min(g.combo+1,5):1;g.lp=g.t;g.score+=10*g.combo;burst(c.x,c.y,'#ff9b3d',12);sfx('pick',g.combo);if(g.L>=10&&!g.itemDone&&g.got>=Math.ceil(g.target/2)){g.itemDone=1;if(g.boss||Math.random()<.5)g.item={x:60+Math.random()*(W-120),y:100+Math.random()*(H-160),k:g.boss?'shield':['shield','mag','slow'][Math.random()*3|0],l:9}}
   if(g.got>=g.target){const R=g.boss?100+40*((g.L/15|0)-1):12+3*(g.L-1);if(!dev)change(R);g.earned+=dev?0:R;sfx('clear');g.cleared++;g.score+=50;g.cl=1.7;g.en.length=0;g.carrots.length=0;g.rw=R;return}}}
 if(g.item){const it=g.item;it.l-=dt;if(it.l<=0)g.item=null;else if(Math.hypot(it.x-r.x,it.y-r.y)<24){if(it.k==='shield')r.sh=1;else if(it.k==='mag')r.mag=7;else g.slow=5;g.item=null;sfx('item');burst(r.x,r.y,'#7df',16)}}
 if(r.mag>0){r.mag-=dt;for(const c of g.carrots){c.x+=(r.x-c.x)*Math.min(1,dt*2.5);c.y+=(r.y-c.y)*Math.min(1,dt*2.5)}}
 r.inv-=dt;
 if(g.grace>0){g.grace-=dt;return}
 const rd=dt;dt=g.slow>0?dt*.45:dt;g.slow-=rd;g.en=g.en.filter(e=>!e.dead);
 for(const e of g.en){
  if(e.t==='fox'||e.t==='wolf'){const dx=r.x-e.x,dy=r.y-e.y,d=Math.hypot(dx,dy)||1,k=Math.min(1,dt*2.2);
   e.vx+=(dx/d*e.s-e.vx)*k;e.vy+=(dy/d*e.s-e.vy)*k;e.x+=e.vx*dt;e.y+=e.vy*dt}
  else if(e.t==='bounce'){e.x+=e.vx*dt;e.y+=e.vy*dt;
   if(e.x<e.r||e.x>W-e.r){e.vx*=-1;e.x=Math.max(e.r,Math.min(W-e.r,e.x))}
   if(e.y<44+e.r||e.y>H-e.r){e.vy*=-1;e.y=Math.max(44+e.r,Math.min(H-e.r,e.y))}}
  else if(e.t==='hawk'){
   if(e.st===0){e.tm-=dt;if(e.tm<=0){const s=Math.random()*4|0;e.x=s===0?0:s===1?W:Math.random()*W;e.y=s===2?44:s===3?H:44+Math.random()*(H-44);e.st=1;sfx('warn');e.w=Math.max(.55,1-.02*g.L)}}
   else if(e.st===1){e.w-=dt;if(e.w>.3){const dx=r.x-e.x,dy=r.y-e.y,d=Math.hypot(dx,dy)||1;e.dx=dx/d;e.dy=dy/d}if(e.w<=0){e.st=2;sfx('dash')}}
   else{const v=340*Math.min(g.sp,1.5)*dt;e.x+=e.dx*v;e.y+=e.dy*v;if(e.x<-60||e.x>W+60||e.y<-60||e.y>H+60){e.st=0;e.tm=.6+Math.random()*1.4}}}
  else if(e.t==='beam'){e.tm+=dt;if(e.s&&e.tm>e.wt&&!e.f){e.f=1;sfx('boom')}if(e.tm>=0&&!e.s){e.s=1;e.p=e.h?r.y+(Math.random()-.5)*60:r.x+(Math.random()-.5)*60}
   if(e.s&&e.tm>e.wt+.25){e.s=0;e.f=0;e.tm=-(.3+Math.random()*.8)}}
  else if(e.t==='meteor'){e.tm+=dt;if(e.s&&e.tm>e.wt&&!e.f){e.f=1;sfx('boom');shake=.15;burst(e.x,e.y,'#ff9b3d',14)}
   if(e.tm>=0&&!e.s){e.s=1;e.x=Math.max(40,Math.min(W-40,r.x+(Math.random()-.5)*100));e.y=Math.max(80,Math.min(H-40,r.y+(Math.random()-.5)*100))}
   if(e.s&&e.tm>e.wt+.3){e.s=0;e.f=0;e.tm=-(.4+Math.random())}}
  else if(e.t==='snake'){e.x+=e.d*95*g.sp*dt;e.ph+=dt*3;e.y=Math.max(50,Math.min(H-12,e.by+Math.sin(e.ph)*55));if(e.x>W+30||e.x<-30){e.d*=-1;e.by=70+Math.random()*(H-130)}}
  else if(e.t==='bat'){e.tm-=dt;if(e.tm<=0){e.tm=.5+Math.random()*.5;const q=Math.random()<.5;e.tx=q?r.x+(Math.random()-.5)*80:Math.random()*W;e.ty=q?r.y+(Math.random()-.5)*80:44+Math.random()*(H-44)}
   const dx=e.tx-e.x,dy=e.ty-e.y,d=Math.hypot(dx,dy)||1,k=Math.min(1,dt*5);e.vx+=(dx/d*150*g.sp-e.vx)*k;e.vy+=(dy/d*150*g.sp-e.vy)*k;e.x=Math.max(10,Math.min(W-10,e.x+e.vx*dt));e.y=Math.max(50,Math.min(H-10,e.y+e.vy*dt))}
  else if(e.t==='ghost'){const dx=r.x-e.x,dy=r.y-e.y,d=Math.hypot(dx,dy)||1;e.slow=Math.hypot(r.vx,r.vy)>60;const v=(e.slow?30:100)*g.sp*dt;e.x+=dx/d*v;e.y+=dy/d*v}
  else if(e.t==='bullet'){e.x+=e.vx*dt;e.y+=e.vy*dt;if(e.x<-20||e.x>W+20||e.y<30||e.y>H+20)e.dead=1}
  else if(e.t==='turret'){e.cd-=dt;if(e.cd<=0){e.cd=Math.max(1.3,2.7-.04*g.L);shoot(e.x,e.y,Math.atan2(r.y-e.y,r.x-e.x),150*Math.min(g.sp,1.5));sfx('warn')}}
  else if(e.t==='spin'){e.a+=dt*1.6*Math.min(g.sp,1.6);e.x=e.cx+Math.cos(e.a)*e.R;e.y=e.cy+Math.sin(e.a)*e.R}
  else if(e.t==='boss'){e.x=W/2+Math.sin(g.t*.6)*150;e.y=120+Math.sin(g.t*1.1)*35;e.bt-=dt;
   if(e.bt<=0){e.bt=Math.max(1,2.1-.02*g.L);const q=e.p++%3,n=g.L/15|0,v=(130+n*15)*Math.min(g.sp,1.6);
    if(q===0){const a=Math.atan2(r.y-e.y,r.x-e.x),m=2+n;for(let i=0;i<m;i++)shoot(e.x,e.y,a+(i-(m-1)/2)*.22,v)}
    else if(q===1){const m=10+n*2,o=Math.random()*6.28;for(let i=0;i<m;i++)shoot(e.x,e.y,o+i*6.283/m,v*.8)}
    else{for(let i=0;i<5+n;i++)shoot(30+Math.random()*(W-60),44,1.5708,v*.9)}
    sfx('warn')}}
  if(r.dash>0||r.inv>0)continue;
  if(e.t==='beam'){if(e.s&&e.tm>e.wt&&Math.abs((e.h?r.y:r.x)-e.p)<18)return die()}
  else if(e.t==='meteor'){if(e.s&&e.tm>e.wt&&Math.hypot(e.x-r.x,e.y-r.y)<e.R+6)return die()}
  else if((e.t!=='hawk'||e.st===2)&&Math.hypot(e.x-r.x,e.y-r.y)<e.r+9)return die()}}

const em=(c,x,y,s)=>{ctx.font=s+'px serif';ctx.fillText(c,x,y)};
function draw(){ctx.save();
 if(shake>0)ctx.translate((Math.random()-.5)*10,(Math.random()-.5)*10);
 const w=g?g.w:WORLDS[0];ctx.fillStyle=w.bg;ctx.fillRect(0,0,W,H);ctx.fillStyle=w.dot;
 for(const d of dots){ctx.beginPath();ctx.arc(d[0],d[1],d[2],0,6.28);ctx.fill()}
 if(g){const r=g.r;
  for(const c of g.carrots){if(c.l<2&&(c.l*8|0)%2)continue;em('🥕',c.x,c.y+Math.sin(g.t*5+c.x)*2,28)}
  if(g.item){const it=g.item;if(it.l>2||(it.l*8|0)%2)em({shield:'🛡️',mag:'🧲',slow:'⏳'}[it.k],it.x,it.y+Math.sin(g.t*6)*3,30)}
  for(const e of g.en){if(e.t==='beam'||e.t==='meteor'||e.t==='bullet')continue;if(e.t==='spin'){ctx.strokeStyle='rgba(255,255,255,.12)';ctx.lineWidth=1;ctx.beginPath();ctx.arc(e.cx,e.cy,e.R,0,6.28);ctx.stroke()}if(e.t==='hawk'&&e.st===0)continue;if(e.t==='ghost')ctx.globalAlpha=e.slow?.45:1;em(e.e,e.x,e.y,e.t==='boss'?64:28);ctx.globalAlpha=1}
  if(r.dash>0){ctx.globalAlpha=.4;em('🐇',r.x-r.vx*.03,r.y-r.vy*.03,30);ctx.globalAlpha=1}
  if(st!=='dying')em('🐇',r.x,r.y,30);
  if(r.sh){ctx.strokeStyle='#7df';ctx.lineWidth=3;ctx.beginPath();ctx.arc(r.x,r.y,19,0,6.28);ctx.stroke()}
  if(w.dark&&!g.boss){const gr=ctx.createRadialGradient(r.x,r.y,70,r.x,r.y,210);gr.addColorStop(0,'rgba(0,0,12,0)');gr.addColorStop(1,'rgba(0,0,12,.88)');ctx.fillStyle=gr;ctx.fillRect(0,0,W,H)}
  for(const e of g.en){
   if(e.t==='hawk'&&e.st===1){ctx.strokeStyle=`rgba(255,60,60,${e.w<.3?1:.5})`;ctx.lineWidth=e.w<.3?4:2;ctx.setLineDash([8,8]);ctx.beginPath();ctx.moveTo(e.x,e.y);ctx.lineTo(e.x+e.dx*900,e.y+e.dy*900);ctx.stroke();ctx.setLineDash([]);em(e.e,e.x,e.y,28)}
   if(e.t==='beam'&&e.s){const on=e.tm>e.wt;ctx.fillStyle=on?'rgba(255,230,80,.95)':'rgba(255,60,60,.28)';
    if(e.h)ctx.fillRect(0,e.p-(on?8:2),W,on?16:4);else ctx.fillRect(e.p-(on?8:2),0,on?16:4,H)}
   if(e.t==='bullet'){ctx.fillStyle='#ff4fd8';ctx.beginPath();ctx.arc(e.x,e.y,6,0,6.28);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.stroke()}
   if(e.t==='meteor'&&e.s){const on=e.tm>e.wt;ctx.beginPath();ctx.arc(e.x,e.y,e.R,0,6.28);
    if(on){ctx.fillStyle='rgba(255,140,30,.9)';ctx.fill();em('💥',e.x,e.y,44)}else{ctx.fillStyle=`rgba(255,60,60,${.12+.25*e.tm/e.wt})`;ctx.fill();ctx.strokeStyle='#ff4040';ctx.lineWidth=2;ctx.stroke()}}}
  ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(0,0,W,40);ctx.fillStyle='#fff';ctx.font='bold 16px system-ui';
  ctx.textAlign='left';ctx.fillText(`LV ${g.L}  🥕 ${g.got}/${g.target}${dev?'  [TEST]':''}`,12,20);
  ctx.textAlign='right';ctx.fillText(`${g.score}${g.combo>1?'  x'+g.combo:''}`,W-12,20);ctx.textAlign='center';
  const bs=g.en.find(e=>e.t==='boss');if(bs){ctx.fillStyle='#400';ctx.fillRect(90,46,300,8);ctx.fillStyle='#e33';ctx.fillRect(90,46,300*(g.target-g.got)/g.target,8);ctx.fillStyle='#fff';ctx.font='12px system-ui';ctx.fillText('BOSS',W/2,66)}
  if(r.mag>0||g.slow>0){ctx.font='14px system-ui';ctx.fillStyle='#fff';ctx.fillText((r.mag>0?'🧲 '+(r.mag|0)+'s  ':'')+(g.slow>0?'⏳ '+(g.slow|0)+'s':''),W/2,H-14)}
  ctx.fillStyle='#ffb347';ctx.fillRect(W/2-40,32,80*Math.max(0,1-Math.max(0,r.cd)/1.5),4);
  if(g.grace>0&&!g.cl){ctx.font='bold 26px system-ui';ctx.fillStyle='#fff';ctx.fillText(`${g.boss?'⚠ BOSS · ':''}Level ${g.L} · ${g.w.n}`,W/2,H/2-60);ctx.font='16px system-ui';ctx.fillText('Get ready…',W/2,H/2-30)}
  if(g.cl>0){ctx.font='bold 34px system-ui';ctx.fillStyle='#fff';ctx.fillText('LEVEL CLEAR!',W/2,H/2-20);ctx.fillStyle='#ffb347';ctx.fillText(dev?'(test mode)':`+${g.rw} 🥕`,W/2,H/2+25)}}
 for(const p of parts){ctx.globalAlpha=Math.max(0,p.l*2);ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,4,4)}ctx.globalAlpha=1;ctx.restore()}

function loop(t){const dt=Math.min(.05,(t-last)/1000||0);last=t;
 if(st==='play')update(dt);shake-=dt;
 for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt;if(p.l<=0)parts.splice(i,1)}
 draw();requestAnimationFrame(loop)}
menu();mus();requestAnimationFrame(loop);
})();
</script></body></html>
