<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Deep Holes – Asset checklist</title>
<style>
  body { font-family: Tahoma, system-ui, sans-serif; background: #0b1120; color: #e2e8f0; margin: 0; padding: 24px; }
  h1 { margin: 0 0 6px; } p { color: #94a3b8; margin: 4px 0 16px; }
  .sum { display: flex; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
  .sum b { background: #1e293b; padding: 8px 14px; border-radius: 8px; }
  h2 { margin: 28px 0 8px; font-size: 18px; color: #93c5fd; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { border-bottom: 1px solid #1e293b; padding: 7px 8px; text-align: right; vertical-align: middle; }
  th { color: #94a3b8; font-weight: 600; }
  code { direction: ltr; unicode-bidi: isolate; display: inline-block; color: #fcd34d; }
  .ok { color: #4ade80; } .miss { color: #64748b; } .warn { color: #fbbf24; }
  img.prev { max-height: 40px; max-width: 160px; image-rendering: pixelated; background: repeating-conic-gradient(#334155 0 25%, #1e293b 0 50%) 0 0/12px 12px; }
  label { cursor: pointer; } input { margin-left: 6px; }
</style>
</head>
<body>
<h1>Deep Holes – لیست فایل‌های طراحی</h1>
<p>هر فایلی که در پوشه <code>assets/</code> با همین اسم بگذاری، بعد از رفرش در بازی جایگزین طراحی پیش‌فرض می‌شود. سبز = پیدا شد، خاکستری = هنوز پیش‌فرض.</p>
<div class="sum" id="sum"></div>
<label><input type="checkbox" id="onlyMissing" />فقط فایل‌هایی که هنوز نساختم</label>
<div id="out"></div>
<script type="module">
import { MANIFEST, SCALE, stateOf } from "./js/assets.js?v=13";
const KIND = { cover: "پس‌زمینه (cover)", "tile-x": "تکرار افقی", "tile-y": "تکرار عمودی", flat: "صاف – بازی پرسپکتیو می‌دهد" };
const rec = (s) => `${s.w * s.frames * SCALE} × ${s.h * SCALE}`;
function render() {
  const only = document.getElementById("onlyMissing").checked;
  let html = "", groups = {}, ok = 0, miss = 0, load = 0;
  for (const s of MANIFEST) (groups[s.group] ||= []).push(s);
  for (const [g, list] of Object.entries(groups)) {
    let rows = "";
    for (const s of list) {
      const st = s.pattern ? { state: "pattern" } : stateOf(s.file);
      if (st.state === "ok") ok++; else if (st.state === "missing") miss++; else if (st.state === "loading") load++;
      if (only && st.state === "ok") continue;
      let status, real = "";
      if (st.state === "ok") {
        const fw = st.im.naturalWidth / s.frames, fh = st.im.naturalHeight;
        const want = s.w / s.h, got = fw / fh, bad = Math.abs(got - want) / want > 0.08 && !["cover", "tile-x", "tile-y"].includes(s.kind);
        real = `${st.im.naturalWidth} × ${st.im.naturalHeight}` + (bad ? ` <span class="warn">⚠ نسبت فریم فرق دارد</span>` : "");
        status = `<span class="ok">✔ پیدا شد</span>`;
      } else if (st.state === "pattern") status = `<span class="miss">الگو</span>`;
      else if (st.state === "loading") status = "…";
      else status = `<span class="miss">پیش‌فرض</span>`;
      rows += `<tr><td>${status}</td><td><code>${s.file}</code></td><td>${s.frames}</td><td><code>${s.w} × ${s.h}</code></td>
        <td><code>${rec(s)}</code></td><td>${real}</td><td>${KIND[s.kind] || (s.frames > 1 ? "اسپرایت‌شیت افقی" : "تک تصویر")}</td><td>${s.desc}</td>
        <td>${st.state === "ok" ? `<img class="prev" src="${st.im.src}">` : ""}</td></tr>`;
    }
    if (rows) html += `<h2>${g}</h2><table><tr><th>وضعیت</th><th>فایل</th><th>فریم</th><th>اندازه در بازی (هر فریم)</th><th>اندازه پیشنهادی فایل</th><th>اندازه فایل تو</th><th>نوع</th><th>توضیح</th><th></th></tr>${rows}</table>`;
  }
  document.getElementById("out").innerHTML = html;
  document.getElementById("sum").innerHTML = `<b>کل: ${MANIFEST.length - 1}</b><b class="ok">ساخته شده: ${ok}</b><b class="miss">پیش‌فرض: ${miss}</b>`;
  if (load) setTimeout(render, 300);
}
document.getElementById("onlyMissing").onchange = render;
render();
</script>
</body>
</html>
